<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Immersphere Asset Lab · Preview Renderer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1024px;
      height: 1024px;
      background: transparent;
      overflow: hidden;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;
      --poster-color: transparent;
    }
    #status {
      position: absolute;
      bottom: 12px;
      right: 12px;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      background: rgba(0,0,0,0.4);
      padding: 4px 10px;
      border-radius: 4px;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <model-viewer
    id="mv"
    camera-controls="false"
    auto-rotate="false"
    rotation-per-second="0deg"
    environment-image="neutral"
    exposure="1.1"
    shadow-intensity="1"
    shadow-softness="0.5"
    style="width:100%;height:100%;"
    loading="eager"
    reveal="auto"
  ></model-viewer>
  <div id="status">Loading…</div>

  <script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <script>
    (function() {
      const params = new URLSearchParams(location.search);
      const modelUrl = params.get('model');
      const mv = document.getElementById('mv');
      const status = document.getElementById('status');

      if (!modelUrl) {
        status.textContent = 'Error: no model param';
        document.title = 'ERROR';
        return;
      }

      mv.src = modelUrl;

      mv.addEventListener('load', () => {
        // Model loaded — orient camera consistently
        try {
          // Orbit: theta, phi, radius
          // Default orbit gives a 3/4 view
          mv.cameraOrbit = '30deg 75deg 120%';
          mv.fieldOfView = '30deg';
          status.textContent = 'Ready';
          // Notify Playwright
          window.__previewReady = true;
          document.title = 'READY';
        } catch (e) {
          status.textContent = 'Error: ' + e.message;
          document.title = 'ERROR';
        }
      });

      mv.addEventListener('error', (e) => {
        status.textContent = 'Model error';
        document.title = 'ERROR';
        console.error(e);
      });

      // Fallback timeout
      setTimeout(() => {
        if (document.title !== 'READY' && document.title !== 'ERROR') {
          status.textContent = 'Timeout';
          document.title = 'TIMEOUT';
        }
      }, 30000);
    })();
  </script>
</body>
</html>
