    <path d="M180 380 L180 420 M332 380 L332 420 M200 380 L200 430 M312 380 L312 430"/>
  </g>

  <!-- Label -->
  <rect x="96" y="440" width="320" height="48" rx="8" fill="#343a40" opacity="0.85"/>
